name: Trigger Codex Cloud Task to refresh data

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:
defaults:
  run:
    shell: bash

jobs:
  comment-on-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add Codex instruction comment
        env:
          # Use a human-owned PAT so the comment author is not github-actions[bot].
          # Mentions from bot accounts are often ignored by automation.
          GH_TOKEN: ${{ secrets.CODEX_TRIGGER_TOKEN }}
          PR_NUMBER: 55
          CODEX_COMMENT_BODY: '@codex Execute Job.md.'
          MIN_SECONDS_BETWEEN_RUNS: 1800
        run: |
          last_comment_created_at="$(
            gh pr view "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json comments \
              --jq '.comments | map(select(.body == env.CODEX_COMMENT_BODY)) | last | .createdAt // empty'
          )"

          if [[ -n "$last_comment_created_at" ]]; then
            last_comment_epoch="$(date -u -d "$last_comment_created_at" +%s)"
            current_epoch="$(date -u +%s)"
            seconds_since_last_run="$((current_epoch - last_comment_epoch))"

            if (( seconds_since_last_run <= MIN_SECONDS_BETWEEN_RUNS )); then
              echo "Skipping Codex task trigger: only ${seconds_since_last_run}s passed since last run."
              exit 0
            fi
          fi

          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$CODEX_COMMENT_BODY"
